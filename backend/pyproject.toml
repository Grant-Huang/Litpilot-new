[project]
name = "litpilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "filelock>=3.16.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
]

[tool.vercel]
entrypoint = "api/index.py:app"
